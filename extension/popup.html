<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { width: 340px; background: #0f172a; color: #f8fafc; padding: 14px; font-size: 13px; }
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e293b; padding-bottom: 8px; margin-bottom: 12px; }
    .logo { font-weight: 700; font-size: 14px; color: #f97316; display: flex; align-items: center; gap: 6px; }
    .badge { background: #f9731620; color: #fb923c; border: 1px solid #f9731640; padding: 2px 6px; border-radius: 99px; font-size: 10px; font-weight: 600; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    label { font-size: 11px; color: #94a3b8; font-weight: 600; display: block; margin-bottom: 3px; }
    input, select { width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #fff; padding: 6px 8px; font-size: 13px; outline: none; }
    input:focus, select:focus { border-color: #f97316; }
    .card { background: #1e293b80; border: 1px solid #334155; border-radius: 8px; padding: 10px; margin-top: 10px; }
    .profit-val { font-size: 20px; font-weight: 800; color: #10b981; }
    .margin-val { font-size: 13px; font-weight: 700; color: #34d399; }
    .row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 11px; color: #cbd5e1; }
    .row-val { font-weight: 600; font-family: monospace; }
    .btn { width: 100%; background: #f97316; color: #fff; border: none; border-radius: 6px; padding: 8px; font-weight: 700; margin-top: 10px; cursor: pointer; }
    .btn:hover { background: #ea580c; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🛍️ EtsyProfit Pro</div>
    <span class="badge">2026 Ready</span>
  </div>

  <div class="grid">
    <div>
      <label>Item Price ($)</label>
      <input type="number" id="itemPrice" value="30.00" step="0.5">
    </div>
    <div>
      <label>Buyer Shipping ($)</label>
      <input type="number" id="shippingCharge" value="0.00" step="0.5">
    </div>
  </div>

  <div class="grid">
    <div>
      <label>Item Cost / POD ($)</label>
      <input type="number" id="itemCost" value="10.00" step="0.5">
    </div>
    <div>
      <label>Actual Shipping ($)</label>
      <input type="number" id="shippingCost" value="4.00" step="0.5">
    </div>
  </div>

  <div>
    <label>Offsite Ads</label>
    <select id="offsiteAds">
      <option value="none">None (0%)</option>
      <option value="optional">Optional (15%)</option>
      <option value="mandatory">Mandatory (12%)</option>
    </select>
  </div>

  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px;">
      <div>
        <label style="margin: 0;">NET PROFIT</label>
        <div class="profit-val" id="netProfit">$12.45</div>
      </div>
      <div style="text-align: right;">
        <label style="margin: 0;">MARGIN</label>
        <div class="margin-val" id="profitMargin">41.5%</div>
      </div>
    </div>

    <div style="border-top: 1px solid #334155; padding-top: 6px; margin-top: 6px;">
      <div class="row">
        <span>Etsy Fees (Total):</span>
        <span class="row-val" id="totalFees">$3.55</span>
      </div>
      <div class="row">
        <span>Break-Even Price:</span>
        <span class="row-val" id="breakEven">$16.20</span>
      </div>
    </div>
  </div>

  <button class="btn" id="openFullApp">Open Advanced Web Calculator</button>

  <script src="popup.js"></script>
</body>
</html>
